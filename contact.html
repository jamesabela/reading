<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Concept Grid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="main-nav"></nav>

    <header class="section" style="padding-top: 10rem;">
        <div class="container">
            <div class="section-header reveal">
                <h1>Get in <span style="color: var(--primary);">Touch</span></h1>
                <p>Have questions or feedback? We'd love to hear from you. Please fill out the form below and our team will get back to you shortly.</p>
            </div>
            
            <div class="card reveal" style="padding: 0; overflow: hidden; height: 1000px; border: 2px solid var(--card-border);">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfMB8x7SFtepmRJeJPAbii8z-PIueqoCXyb_ndKkOd1E2JaZA/viewform?embedded=true" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0">Loading form…</iframe>
            </div>
        </div>
    </header>

    <footer id="main-footer"></footer>
    <script src="components.js"></script>
    <script data-goatcounter="https://jabela.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
