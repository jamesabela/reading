<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticker Pro - Concept Grid</title>
    <!-- Use the existing site styles -->
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        /* Tool-Specific Styling Override */
        :root {
            /* Ticker Custom Config (State Driven) */
            --tk-speed: 20s;
            --tk-bg: #1e293b;
            --tk-accent: #F15A24;
            --tk-text: #ffffff;
        }

        body {
            /* Now using global styles.css, but we refine for our flex layout */
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-top: 80px; 
            overflow: hidden;
            background-color: var(--bg-warm) !important;
        }

        /* Tool Editor Container */
        .editor-container {
            flex: 1;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2.5rem;
            align-items: flex-start;
        }

        /* Forms Styling */
        .card-panel {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 2rem;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(241, 90, 36, 0.05);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .config-group label {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        textarea {
            width: 100%;
            height: 350px;
            background: #fff;
            border: 2px solid var(--card-border);
            padding: 1.5rem;
            border-radius: 1.5rem;
            color: var(--text-main);
            font-family: 'Roboto Mono', monospace;
            font-size: 1.1rem;
            line-height: 1.6;
            outline: none;
            transition: var(--transition);
            resize: none;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        select {
            background: #fff;
            border: 2px solid var(--card-border);
            padding: 1rem;
            border-radius: 1rem;
            color: var(--text-main);
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }

        /* Themes */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .theme-btn {
            height: 48px;
            border-radius: 1rem;
            cursor: pointer;
            border: 3px solid transparent;
            transition: var(--transition);
        }

        .theme-btn.active {
            border-color: var(--secondary);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(241, 90, 36, 0.2);
        }

        /* Live Preview Label */
        .preview-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background: #1ABC9C;
            border-radius: 50%;
            animation: pulse-dot-anim 2s infinite;
        }

        @keyframes pulse-dot-anim {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Ticker Bottom Pinned Area */
        .ticker-section {
            background: #fff;
            border-top: 2px solid var(--card-border);
            padding: 2.5rem 0;
            z-index: 10;
        }

        .ticker-wrap {
            width: 100%;
            height: 90px;
            overflow: hidden;
            background-color: var(--tk-bg);
            border-top: 4px solid var(--tk-accent);
            border-bottom: 4px solid var(--tk-accent);
            display: flex;
            align-items: center;
            white-space: nowrap;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .ticker-move {
            display: flex;
            width: fit-content;
            animation: ticker-loop var(--tk-speed) linear infinite;
        }

        .ticker-item {
            padding: 0 3.5rem;
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--tk-text);
            display: flex;
            align-items: center;
            font-family: 'Fredoka', sans-serif;
        }

        .ticker-item span {
            color: var(--tk-accent);
            margin: 0 2rem;
            font-weight: 900;
        }

        @keyframes ticker-loop {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        /* Popup Mode Styling (High-Contrast Reset) */
        body.popup-mode {
            background: var(--tk-bg) !important;
            padding-top: 0 !important;
            min-height: 100vh;
        }

        body.popup-mode #main-nav,
        body.popup-mode .editor-container,
        body.popup-mode .preview-label {
            display: none !important;
            visibility: hidden !important;
        }

        body.popup-mode .ticker-section {
            padding: 0 !important;
            border: none !important;
            background: none !important;
        }

        body.popup-mode .ticker-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border-top: none;
            border-bottom: none;
            border-left: 20px solid var(--tk-accent);
        }

        body.popup-mode .ticker-item {
            font-size: 4rem;
        }

    </style>
</head>
<body>
    <nav id="main-nav"></nav>

    <div class="editor-container">
        <header class="editor-header">
            <div>
                <h1>Ticker Pro</h1>
                <p style="color: var(--text-muted); font-weight: 500;">Custom news-tape for your classroom & presentations.</p>
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-secondary" id="copy-url">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    Copy Share Link
                </button>
                <button class="btn btn-primary" id="launch-popup">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 15h4v4"/><path d="M10 10l9 9"/></svg>
                    Launch Pop-out (No URL Bar)
                </button>
            </div>
        </header>

        <div class="editor-grid">
            <div class="card-panel">
                <div class="config-group">
                    <label>Scroll Speed</label>
                    <select id="speed-select">
                        <option value="60s">Very Slow</option>
                        <option value="40s">Slow</option>
                        <option value="20s" selected>Classic News</option>
                        <option value="12s">Fast</option>
                        <option value="6s">High Energy</option>
                    </select>
                </div>

                <div class="config-group">
                    <label>Design Theme</label>
                    <div class="theme-grid" id="theme-grid">
                        <div class="theme-btn active" style="background: #ef4444;" data-bg="#1e293b" data-accent="#F15A24" data-text="#fff"></div>
                        <div class="theme-btn" style="background: #10b981;" data-bg="#064e3b" data-accent="#10b981" data-text="#fff"></div>
                        <div class="theme-btn" style="background: #3b82f6;" data-bg="#1e3a8a" data-accent="#3b82f6" data-text="#fff"></div>
                        <div class="theme-btn" style="background: #ffffff; border: 1px solid #ddd;" data-bg="#ffffff" data-accent="#F15A24" data-text="#333"></div>
                        <div class="theme-btn" style="background: #000000;" data-bg="#000" data-accent="#29ABE2" data-text="#fff"></div>
                        <div class="theme-btn" style="background: #f59e0b;" data-bg="#451a03" data-accent="#FBB03B" data-text="#fff"></div>
                    </div>
                </div>

                <div style="background: var(--bg-warm); padding: 1.5rem; border-radius: 1rem; border: 2px dashed var(--card-border);">
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0;">
                        <strong>Pro Tip:</strong> Position the Pop-out window at the bottom of your screen. It stay URL-free in Chrome/Edge!
                    </p>
                </div>
            </div>

            <div class="config-group">
                <label>Ticker Message List (One per line)</label>
                <textarea id="ticker-input" spellcheck="false">BREAKING NEWS: New features added to Concept Grid!
MASTER LITERACY: Join our upcoming webinar on EAL support.
TOOL UPDATE: Ticker Pro is now live and ready for your classroom.
RESOURCES: Check the 'More Tools' section for Star Wars Crawler and Minecraft Reader.</textarea>
            </div>
        </div>
    </div>

    <section class="ticker-section">
        <div class="container" id="ticker-preview-container">
            <div class="preview-label">
                <div class="pulse-dot"></div>
                Live Ticker Preview
            </div>
            
            <div class="ticker-wrap" id="ticker-wrap">
                <div class="ticker-move" id="ticker-move">
                    <div class="ticker-item" id="ticker-content"></div>
                    <div class="ticker-item" id="ticker-content-clone"></div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const tickerInput = document.getElementById('ticker-input');
        const speedSelect = document.getElementById('speed-select');
        const themeGrid = document.getElementById('theme-grid');
        const launchBtn = document.getElementById('launch-popup');
        const copyBtn = document.getElementById('copy-url');
        
        const tickerContent = document.getElementById('ticker-content');
        const tickerClone = document.getElementById('ticker-content-clone');
        const tickerWrap = document.getElementById('ticker-wrap');
        const tickerPreviewContainer = document.getElementById('ticker-preview-container');

        let config = {
            text: tickerInput.value,
            speed: '20s',
            bg: '#1e293b',
            accent: '#F15A24',
            textColor: '#ffffff'
        };

        let pipWindow = null;

        const params = new URLSearchParams(window.location.search);
        if (params.get('popup')) {
            document.body.classList.add('popup-mode');
        }

        function loadFromUrl() {
            if (params.has('t')) config.text = params.get('t');
            if (params.has('s')) config.speed = params.get('s');
            if (params.has('bg')) config.bg = '#' + params.get('bg');
            if (params.has('a')) config.accent = '#' + params.get('a');
            if (params.has('c')) config.textColor = '#' + params.get('c');

            tickerInput.value = config.text;
            speedSelect.value = config.speed;
            updateUI();
        }

        function updateUI() {
            const items = config.text.split('\n').filter(i => i.trim() !== '');
            const html = items.map(item => `${item} <span>•</span>`).join(' ');
            
            tickerContent.innerHTML = html;
            tickerClone.innerHTML = html;

            document.documentElement.style.setProperty('--tk-speed', config.speed);
            document.documentElement.style.setProperty('--tk-bg', config.bg);
            document.documentElement.style.setProperty('--tk-accent', config.accent);
            document.documentElement.style.setProperty('--tk-text', config.textColor);
            
            document.querySelectorAll('.theme-btn').forEach(btn => {
                const isActive = btn.dataset.bg === config.bg && btn.dataset.accent === config.accent;
                btn.classList.toggle('active', isActive);
            });

            // Sync to PiP window if open
            if (pipWindow) {
                const pipDoc = pipWindow.document;
                const pipContent = pipDoc.getElementById('ticker-content');
                const pipClone = pipDoc.getElementById('ticker-content-clone');
                
                if (pipContent) pipContent.innerHTML = html;
                if (pipClone) pipClone.innerHTML = html;
                
                pipDoc.documentElement.style.setProperty('--tk-speed', config.speed);
                pipDoc.documentElement.style.setProperty('--tk-bg', config.bg);
                pipDoc.documentElement.style.setProperty('--tk-accent', config.accent);
                pipDoc.documentElement.style.setProperty('--tk-text', config.textColor);
            }
        }

        tickerInput.addEventListener('input', (e) => {
            config.text = e.target.value;
            updateUI();
        });

        speedSelect.addEventListener('change', (e) => {
            config.speed = e.target.value;
            updateUI();
        });

        themeGrid.addEventListener('click', (e) => {
            if (e.target.classList.contains('theme-btn')) {
                config.bg = e.target.dataset.bg;
                config.accent = e.target.dataset.accent;
                config.textColor = e.target.dataset.text;
                updateUI();
            }
        });

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                const res = document.execCommand('copy');
                textArea.remove();
                return res ? Promise.resolve() : Promise.reject();
            }
        }

        launchBtn.addEventListener('click', async () => {
            const url = new URL(window.location.href);
            url.searchParams.set('t', config.text);
            url.searchParams.set('s', config.speed);
            url.searchParams.set('bg', config.bg.replace('#', ''));
            url.searchParams.set('a', config.accent.replace('#', ''));
            url.searchParams.set('c', config.textColor.replace('#', ''));

            // Try Document Picture-in-Picture first (No URL bar)
            if ('documentPictureInPicture' in window) {
                try {
                    pipWindow = await documentPictureInPicture.requestWindow({
                        width: 1400,
                        height: 120,
                    });

                    // Copy styles to pip window
                    [...document.styleSheets].forEach((styleSheet) => {
                        try {
                            const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
                            const style = document.createElement('style');
                            style.textContent = cssRules;
                            pipWindow.document.head.appendChild(style);
                        } catch (e) {
                            const link = document.createElement('link');
                            link.rel = 'stylesheet';
                            link.type = styleSheet.type;
                            link.media = styleSheet.media;
                            link.href = styleSheet.href;
                            pipWindow.document.head.appendChild(link);
                        }
                    });

                    // Add body class for visibility
                    pipWindow.document.body.classList.add('popup-mode');

                    // Clone the ticker wrap into the pip window
                    const tickerCloneElement = tickerWrap.cloneNode(true);
                    pipWindow.document.body.appendChild(tickerCloneElement);

                    // Handle closing
                    pipWindow.addEventListener('pagehide', () => {
                        pipWindow = null;
                    });

                    // Initial sync
                    updateUI();
                    return;

                } catch (err) {
                    console.error("PiP failed, falling back to window.open", err);
                }
            }

            // Fallback for Safari/Firefox
            url.searchParams.set('popup', 'true');
            window.open(url.toString(), 'TickerPopup', 'width=1400,height=120,menubar=no,toolbar=no,location=no,status=no');
        });

        copyBtn.addEventListener('click', () => {
            const url = new URL(window.location.href.split('?')[0]);
            url.searchParams.set('t', config.text);
            url.searchParams.set('s', config.speed);
            url.searchParams.set('bg', config.bg.replace('#', ''));
            url.searchParams.set('a', config.accent.replace('#', ''));
            url.searchParams.set('c', config.textColor.replace('#', ''));
            copyToClipboard(url.toString()).then(() => alert('Link copied to clipboard!')).catch(() => alert('Copy failed.'));
        });

        loadFromUrl();
    </script>
    <script src="components.js"></script>
</body>
</html>
