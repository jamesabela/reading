<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penalty Shootout: Definition Master</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            box-shadow: 0 20px 80px rgba(0,0,0,0.8);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 85%;
            max-width: 550px;
            text-align: center;
            pointer-events: auto;
            display: none;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .overlay h2 {
            margin-top: 0;
            font-size: 32px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 500;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        button.correct {
            background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%) !important;
            border-color: #2ecc71 !important;
        }
        button.wrong {
            background: linear-gradient(135deg, #c0392b 0%, #922b21 100%) !important;
            border-color: #e74c3c !important;
        }
        #scoreboard {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .score-unit {
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
            border-bottom: 3px solid #00d2ff;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div id="scoreboard" style="display: none;">
                <div id="p1-score-unit" class="score-unit"><span id="p1-name-display">PLAYER 1</span>: <span id="p1-score">0</span></div>
                <div id="p2-score-unit" class="score-unit"><span id="p2-name-display">PLAYER 2</span>: <span id="p2-score">0</span></div>
                <div id="solo-score-unit" class="score-unit" style="display: none;">GOALS: <span id="solo-score">0</span> / 5</div>
            </div>

            <!-- Mode Selection Overlay -->
            <div id="mode-overlay" class="overlay" style="display: block;">
                <h2>SELECT GAME MODE</h2>
                <div class="options-grid" style="grid-template-columns: 1fr;">
                    <button onclick="selectMode('1P')" style="font-size: 20px; padding: 25px;">👤 SINGLE PLAYER vs CPU</button>
                    <button onclick="selectMode('2P')" style="font-size: 20px; padding: 25px;">👥 2 PLAYER (LOCAL)</button>
                </div>
                <div style="margin-top: 22px; text-align: left; pointer-events: auto;">
                    <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 12px;">
                        <button id="mute-toggle-btn" style="flex: 0 0 auto; padding: 12px 16px;">MUTE</button>
                        <span id="volume-label" style="font-size: 14px; opacity: 0.85;">VOLUME: 30%</span>
                    </div>
                    <input id="volume-slider" type="range" min="0" max="100" value="30" style="width: 100%;">
                </div>
            </div>

            <!-- Team Setup Overlay -->
            <div id="setup-overlay" class="overlay">
                <h2 id="setup-title">PLAYER 1 SETUP</h2>
                <input type="text" id="team-name-input" placeholder="Team Name" style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box;">
                <div class="options-grid" id="color-picker">
                    <!-- Colors added via JS -->
                </div>
                
                <h3 style="margin-top: 20px; font-size: 14px; opacity: 0.8;">CHOOSE GOALKEEPER</h3>
                <div class="options-grid" id="gk-picker" style="grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button class="gk-opt" id="gk-female" onclick="selectGK('female')" style="padding: 10px; border: 2px solid #3498db; border-radius: 8px; background: rgba(52, 152, 219, 0.2); color: #fff;">👩 FEMALE</button>
                    <button class="gk-opt" id="gk-male" onclick="selectGK('male')" style="padding: 10px; border: 2px solid transparent; border-radius: 8px; background: rgba(255, 255, 255, 0.1); color: #fff;">👨 MALE</button>
                </div>
                <button id="next-setup-btn" style="width: 100%; margin-top: 20px; background: #00d2ff; color: #000; font-weight: bold;">CONTINUE</button>
            </div>

            <!-- Question Overlay -->
            <div id="question-overlay" class="overlay" style="top: 110px; left: 50%; transform: translateX(-50%); width: 70%; max-width: 620px; padding: 24px 32px; pointer-events: none;">
                <h3 id="question-title" style="margin-top: 0; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; color: #fff;">Pick the correct word!</h3>
                <h3 id="question-def">Definition goes here...</h3>
            </div>

            <div id="result-overlay" class="overlay">
                <h2 id="result-title">RESULT</h2>
                <h3 id="result-answer">Correct answer goes here...</h3>
                <button id="result-continue-btn" style="width:100%; background: #00d2ff; color: #000; font-weight: bold;">CONTINUE</button>
            </div>

            <!-- Game Over Overlay -->
            <div id="gameover-overlay" class="overlay">
                <h2 id="final-result">RESULT</h2>
                <h3 id="final-score">0 - 0</h3>
                <button onclick="location.reload()" style="width:100%; background: #00d2ff; color: #000;">PLAY AGAIN</button>
            </div>
        </div>
    </div>
    <script src="game.js?v=20260426-4"></script>
</body>
</html>
